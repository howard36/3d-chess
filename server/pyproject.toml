[project]
name = "3d-chess-backend"
version = "0.1.0"
description = "3D Chess backend on Modal"
requires-python = ">=3.13,<3.14"
dependencies = [
  # Plain FastAPI: Modal serves the ASGI app itself, so the production image
  # needs none of `standard` (a server, a CLI, OpenTelemetry's SDK). The local
  # server comes from the test extra's uvicorn.
  "fastapi>=0.143.0",
]

[project.optional-dependencies]
# Only what `modal deploy` needs locally; the production image installs the
# main dependencies from uv.lock (see modal_app.py).
deploy = ["modal>=1.5,<2"]
test = [
  "3d-chess-backend[deploy]",  # tests import modal_app, which imports modal
  "uvicorn[standard]",
  "pytest",
  "pytest-asyncio>=1.0",
  "httpx2",  # Starlette's TestClient prefers it; plain httpx is deprecated there
  "websockets",
  # Pinned so CI's messages.py freshness check is byte-stable across runs
  "datamodel-code-generator==0.83.0",
  "ruff",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["modal_app", "messages"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["messages.py"]  # generated by datamodel-codegen
force-exclude = true  # so the format hook skips it even when passed explicitly

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
