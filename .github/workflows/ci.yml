name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install server dependencies
        run: uv sync --extra test
        working-directory: server
      - name: Run server tests
        run: uv run --project server pytest
      # messages.py is generated from schema.json; a schema change that skips
      # regeneration would silently desync the validated wire format.
      - name: Check messages.py is current with schema.json
        run: |
          uv run datamodel-codegen --input schema.json --input-file-type jsonschema \
            --output messages.py --output-model-type pydantic_v2.BaseModel --disable-timestamp
          git diff --exit-code messages.py
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Run linter
        run: npm run lint
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
      - name: Run tests with coverage
        run: npm run test -- --coverage
        working-directory: client
      # src/types/schema.ts is generated from server/schema.json; a stale copy
      # means the client compiles against a protocol the server no longer speaks.
      - name: Check generated types are current with schema.json
        run: |
          npm run generate:types
          git diff --exit-code src/types/schema.ts
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install server dependencies
        run: uv sync --extra test
        working-directory: server
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Run Playwright E2E tests
        run: npm run e2e
        working-directory: client
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  deploy:
    # Publishes the merged commit's app to Modal. Gated on the full suite so a
    # red build can't reach production, and on push-to-main so the
    # pull_request trigger above never deploys a branch.
    needs: [server-tests, client, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys: two merges in quick succession must not race each
    # other into Modal. Never cancel — a half-applied deploy is worse than a
    # slow one.
    concurrency:
      group: deploy-modal
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install server dependencies
        run: uv sync --extra test
        working-directory: server
      # Run from server/ so add_local_python_source("messages") resolves.
      - name: Deploy Modal app
        run: uv run modal deploy modal_app.py
        working-directory: server
      # max_containers=1 means no warm replica, so the first request after a
      # deploy pays a cold start. Poll rather than assume.
      - name: Verify deployment health
        env:
          URL: https://howard36--3d-chess-backend-serve.modal.run
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$URL/health" | grep -q healthy; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed after 150s"
          exit 1
