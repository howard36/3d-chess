name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the runs still going on its older
# commits: only the latest head needs checking. A push to main gets a group of
# its own commit, so no run on main is ever cancelled or held back (a group
# also drops a pending run when another queues), and every merge is tested
# and deployed.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install server dependencies
        run: uv sync --extra test
        working-directory: server
      - name: Lint server (ruff)
        run: |
          uv run --project server ruff check server
          uv run --project server ruff format --check server
      - name: Run server tests
        run: uv run --project server pytest
      # messages.py is generated from schema.json; a schema change that skips
      # regeneration would silently desync the validated wire format.
      - name: Check messages.py is current with schema.json
        run: |
          uv run datamodel-codegen --input schema.json --input-file-type jsonschema \
            --output messages.py --output-model-type pydantic_v2.BaseModel --disable-timestamp
          git diff --exit-code messages.py
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Run linter
        run: npm run lint
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
      - name: Run tests with coverage
        run: npm run test -- --coverage
        working-directory: client
      # src/types/schema.ts is generated from server/schema.json; a stale copy
      # means the client compiles against a protocol the server no longer speaks.
      - name: Check generated types are current with schema.json
        run: |
          npm run generate:types
          git diff --exit-code src/types/schema.ts
        working-directory: client

  e2e-group:
    # The suite is CPU-bound (every page draws in software), so it is split
    # over parallel runners; the groups are defined in playwright.config.ts,
    # and `rest` takes every spec the others don't name.
    strategy:
      fail-fast: false
      matrix:
        group: [games, session, rest]
    name: e2e (${{ matrix.group }})
    runs-on: ubuntu-latest
    # A group takes about 10 minutes, and three stalled tries at the OS
    # packages below add at most 16; a hung step fails the job long before
    # GitHub's 6-hour default
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install server dependencies
        run: uv sync --extra test
        working-directory: server
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      # The Chromium download (~150MB) is cached per Playwright version; the
      # key comes from the lockfile so a bump invalidates it. OS packages are
      # not part of the cache, so a hit still runs install-deps.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
        working-directory: client
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: client
      # apt can stall on a runner (a mirror or the package lock) and never
      # return: each try is cut off at 5 minutes, and a stalled one is retried
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for attempt in 1 2 3; do
            timeout -k 15 300 npx playwright install-deps chromium && exit 0
            echo "install-deps attempt $attempt failed or stalled; retrying"
            sleep 10
          done
          exit 1
        working-directory: client
      - name: Run Playwright E2E tests
        run: npm run e2e
        working-directory: client
        env:
          E2E_GROUP: ${{ matrix.group }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.group }}
          path: client/playwright-report
          retention-days: 7

  # One check for the whole suite, under the name it always had (branch
  # protection and the deploy wait on `e2e`): green only if every group is.
  e2e:
    needs: e2e-group
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every E2E group passed
        run: test "${{ needs.e2e-group.result }}" = success

  deploy:
    # Publishes the merged commit's app to Modal. Gated on the full suite so a
    # red build can't reach production, and on push-to-main so the
    # pull_request trigger above never deploys a branch.
    needs: [server-tests, client, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys: two merges in quick succession must not race each
    # other into Modal. Never cancel — a half-applied deploy is worse than a
    # slow one.
    concurrency:
      group: deploy-modal
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install deploy dependencies
        run: uv sync --extra deploy
        working-directory: server
      # Run from server/ so Image.uv_sync("./") and
      # add_local_python_source("messages") resolve. GITHUB_SHA is baked into
      # the image as APP_VERSION so the health check below can tell the new
      # deployment from the old one (which was already healthy).
      - name: Deploy Modal app
        run: uv run modal deploy modal_app.py
        working-directory: server
      # max_containers=1 means no warm replica, so the first request after a
      # deploy pays a cold start. Poll until /health reports this commit.
      - name: Verify deployment serves this commit
        env:
          URL: https://howard36--3d-chess-backend-serve.modal.run
        # Each request is bounded, and so is the whole wait: an unbounded curl
        # once held this step for 19 minutes.
        run: |
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS --connect-timeout 10 --max-time 30 "$URL/health" \
              | grep -q "\"version\":\"$GITHUB_SHA\""; then
              echo "serving $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "deployment did not report version $GITHUB_SHA within 300s"
          curl -fsS --connect-timeout 10 --max-time 30 "$URL/health" || true
          exit 1
