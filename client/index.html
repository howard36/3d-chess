<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Chess</title>
    <!-- A game's address is served a copy with the invitation's title and
         description
         (invite.html, vite.config.ts; public/_redirects) -->
    <meta name="description" content="Chess in three dimensions, on a 5×5×5 board." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="3D Chess" />
    <meta property="og:title" content="3D Chess" />
    <meta property="og:description" content="Chess in three dimensions, on a 5×5×5 board." />
    <!-- Rendered by scripts/readme-image.mjs, with the README's picture; a
         preview deployment points at its own copy (vite.config.ts) -->
    <meta property="og:image" content="https://3dchess.club/og.jpg" />
    <meta property="og:image:width" content="1400" />
    <meta property="og:image:height" content="733" />
    <meta
      property="og:image:alt"
      content="A five-level glass chess tower with every piece on its starting square"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
